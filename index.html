<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>put.io Audiobooks</title>
<meta name="description" content="An audiobook player for your put.io files.">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audiobooks">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src https: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="boot">
<main id="app"></main>
<div id="mini" hidden></div>
<section id="player" aria-label="Now playing" hidden></section>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto"></audio>
<script type="module" src="app.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
